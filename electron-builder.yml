appId: com.decoy.app
productName: Decoy
directories:
  output: release
files:
  - out/**
  - package.json
extraResources:
  - from: build/icon.png
    to: icon.png
win:
  target: nsis
  icon: build/icon.png
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
mac:
  target:
    target: dmg
    arch: universal
  icon: build/icon.png
  category: public.app-category.developer-tools
linux:
  target: AppImage
  icon: build/icon.png
  category: Development
